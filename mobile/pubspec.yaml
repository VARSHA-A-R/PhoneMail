name: mobile
description: PhoneMail mobile application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.5.0
  http_parser: ^4.1.2

  file_picker: ^10.3.3
  image_picker: ^1.2.0
  open_filex: ^4.7.0

  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1

  flutter_contacts: ^2.0.2
